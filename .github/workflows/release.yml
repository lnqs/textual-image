name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Publish an existing tag (e.g. v0.13.2)
        required: true

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      released_version: ${{ steps.release.outputs.released_version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Sync to triggering commit
      run: git reset --hard "${{ github.event.workflow_run.head_sha }}"

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Release
      id: release
      env:
        CZ_NON_INTERACTIVE: "1"
      run: |
        uv sync --locked --no-install-project

        version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

        if ! git rev-parse "v${version}" >/dev/null 2>&1; then
          echo "Tagging v${version} for current release"
          git tag "v${version}"
          git push origin "v${version}"
          echo "released_version=${version}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        set +e
        uv run cz bump --dry-run
        check_code=$?
        set -e

        if [ "$check_code" -eq 21 ]; then
          echo "No release needed"
          exit 0
        elif [ "$check_code" -ne 0 ]; then
          echo "cz bump --dry-run failed (exit ${check_code})"
          exit 1
        fi

        uv run cz bump --yes --changelog --version-files-only
        uv lock

        version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        git add pyproject.toml CHANGELOG.md uv.lock
        git commit -m "chore(release): bump version to ${version}"
        git tag "v${version}"
        git push origin main --follow-tags

        echo "released_version=${version}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [release]
    if: >
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.release.result == 'success' && needs.release.outputs.released_version != '')
      )
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/textual-image

    permissions:
      id-token: write
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tag || format('v{0}', needs.release.outputs.released_version) }}

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true

    - name: Build
      run: uv build

    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tag || format('v{0}', needs.release.outputs.released_version) }}
      run: |
        version="${TAG#v}"
        notes_file="$(mktemp)"

        set +e
        python3 - "$version" "$notes_file" <<'PY'
        import re
        import sys
        from pathlib import Path

        version, notes_path = sys.argv[1], sys.argv[2]
        changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
        pattern = rf"^## (?:\[{re.escape(version)}\]|v?{re.escape(version)}\b).*?(?=^## |\Z)"
        match = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)
        if match:
            Path(notes_path).write_text(match.group(0).strip() + "\n", encoding="utf-8")
            sys.exit(0)
        sys.exit(1)
        PY
        notes_ok=$?
        set -e

        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" dist/* --clobber
        elif [ "$notes_ok" -eq 0 ]; then
          gh release create "$TAG" dist/* --title "$TAG" --notes-file "$notes_file"
        else
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes
        fi
