name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/textual-image

    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Sync to triggering commit
      run: git reset --hard "${{ github.event.workflow_run.head_sha }}"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Release
      id: release
      env:
        CZ_NON_INTERACTIVE: "1"
      run: |
        uv sync --locked --no-install-project

        version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

        if ! git rev-parse "v${version}" >/dev/null 2>&1; then
          echo "Tagging v${version} for current release"
          git tag "v${version}"
          git push origin "v${version}"
          echo "released_version=${version}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        set +e
        uv run cz bump --yes
        bump_code=$?
        set -e

        if [ "$bump_code" -eq 21 ]; then
          echo "No release needed"
          exit 0
        elif [ "$bump_code" -ne 0 ]; then
          echo "Release failed (exit ${bump_code})"
          exit "$bump_code"
        fi

        version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

        uv lock
        git add uv.lock
        if ! git diff --staged --quiet; then
          git commit --amend --no-edit
          # Amend moves HEAD; retarget the tag so the push below includes it
          git tag -f -a "v${version}" -m "v${version}"
        fi

        git push origin main
        git push origin "v${version}"

        echo "released_version=${version}" >> "$GITHUB_OUTPUT"

    - name: Build
      if: steps.release.outputs.released_version != ''
      run: uv build

    - name: Publish
      if: steps.release.outputs.released_version != ''
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Create GitHub Release
      if: steps.release.outputs.released_version != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version="${{ steps.release.outputs.released_version }}"
        awk -v ver="$version" '
          $0 ~ "^## \\[" ver "\\]" { found=1; next }
          found && /^## / { exit }
          found { print }
        ' CHANGELOG.md > /tmp/release-notes.md
        gh release create "v${version}" \
          --title "v${version}" \
          --notes-file /tmp/release-notes.md \
          dist/*
